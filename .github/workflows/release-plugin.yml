name: Release Plugin

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0.0 && git push origin v0.2.0.0
# The tag (minus the leading "v") becomes AssemblyVersion, which is what
# Dalamud's installer compares to decide an update is available, so every
# release needs a new tag, there's no auto-bumping here.
#
# Mirrors RoarkGit/XIV-Raid-Tools' release-plugin.yml - the two share
# pluginmaster.json (RoarkGit/DalamudPlugins) and update it the same way,
# each touching only its own entry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release. pluginmaster.json lives in a separate repo
                       # (RoarkGit/DalamudPlugins, shared with XIV-Raid-Tools) - see the last
                       # step - so this token's write access to THIS repo has nothing to do with
                       # that.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force dalamud-latest.zip "$env:RUNNER_TEMP\dalamud"
          echo "DALAMUD_HOME=$env:RUNNER_TEMP\dalamud" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: >
          dotnet build XIVMit.csproj
          -c Release
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: bin/Release/XIVMit/latest.zip
          fail_on_unmatched_files: true

      # pluginmaster.json lives in RoarkGit/DalamudPlugins, shared with XIV-Raid-Tools' own
      # release workflow - each plugin updates only its own entry there. GITHUB_TOKEN only
      # grants write access to THIS repo, so the push needs a PAT scoped to the shared repo
      # instead (fine-grained, contents: read/write, repo: DalamudPlugins only), stored as this
      # repo's PLUGINMASTER_REPO_TOKEN secret - a separate secret from XIV-Raid-Tools' copy of
      # the same name, since a repo secret isn't shared across repos.
      - name: Update pluginmaster.json in DalamudPlugins
        shell: bash
        env:
          PLUGINMASTER_REPO_TOKEN: ${{ secrets.PLUGINMASTER_REPO_TOKEN }}
        run: |
          # Read AssemblyVersion back from the manifest DalamudPackager just generated, rather
          # than re-deriving it from the tag string - see XIV-Raid-Tools' identical step for why
          # (a 3-part tag normalizes to 4 parts in the actual shipped manifest).
          built_version=$(python3 -c "import json; print(json.load(open('bin/Release/XIVMit/XIVMit.json'))['AssemblyVersion'])")

          git clone "https://x-access-token:${PLUGINMASTER_REPO_TOKEN}@github.com/RoarkGit/DalamudPlugins.git" "$RUNNER_TEMP/dalamud-plugins"
          cd "$RUNNER_TEMP/dalamud-plugins"

          python3 - <<EOF
          import json, time

          with open("pluginmaster.json") as f:
              data = json.load(f)

          # By InternalName, not data[0] - the shared file holds more than one plugin's entry,
          # and this workflow must only ever touch its own.
          entry = next(e for e in data if e["InternalName"] == "XIVMit")
          entry["AssemblyVersion"] = "$built_version"
          entry["LastUpdate"] = int(time.time())
          url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/latest.zip"
          entry["DownloadLinkInstall"] = url
          entry["DownloadLinkUpdate"] = url
          # Seeded IsHide:true until a real release exists to install - the first one flips it,
          # every one after is a no-op write of the same value.
          entry["IsHide"] = False

          with open("pluginmaster.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update XIVMit entry for ${{ steps.ver.outputs.tag }}"
          git push origin main
